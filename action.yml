name: Heyo Code Audit
description: Verified AI code reviews for GitHub pull requests, with independent finding verification.
author: Heyo
branding:
  icon: shield
  color: purple
inputs:
  provider:
    description: Pi provider identifier used for the audit.
    required: false
    default: openai
  model:
    description: Provider-specific model identifier used for the audit.
    required: true
  auth-type:
    description: "Authentication mode: api-key, oauth, aws, or bedrock-bearer."
    required: true
  auth-token:
    description: API key, OAuth access token, or Bedrock bearer token for the selected auth type.
    required: false
  aws-region:
    description: Optional AWS region for amazon-bedrock authentication.
    required: false
  aws-profile:
    description: Optional AWS shared-config profile for amazon-bedrock authentication.
    required: false
  github-token:
    description: GitHub token used only to read PR metadata and publish reports.
    required: true
  checks:
    description: Comma-separated checks to enable.
    required: false
  verification:
    description: Verify every candidate in a separate Pi session.
    required: false
    default: "true"
  report:
    description: "Reporting mode: check, comment, check-and-comment, or none."
    required: false
    default: check-and-comment
  comment-on-clean:
    description: Publish a clean PR review when there are no findings.
    required: false
    default: "false"
  summary-comment:
    description: Keep one updatable PR comment with the confidence score, the verdict, linked findings, and a summary of the change. Requires report comment or check-and-comment.
    required: false
    default: "true"
  fail-on:
    description: Minimum finding severity that fails the audit.
    required: false
    default: high
  paths:
    description: Comma-separated repository globs to audit.
    required: false
  incremental:
    description: Audit only changes since the last compatible Heyo state.
    required: false
    default: "true"
  max-pr-commits:
    description: Maximum commits for a full audit, or unlimited.
    required: false
    default: "100"
  max-new-commits:
    description: Maximum newly added commits for an incremental audit, or unlimited.
    required: false
    default: "20"
  langfuse-public-key:
    description: Optional Langfuse public key. With langfuse-secret-key, every Pi session is traced in Langfuse.
    required: false
  langfuse-secret-key:
    description: Optional Langfuse secret key, set together with langfuse-public-key.
    required: false
  langfuse-base-url:
    description: Langfuse host that receives the traces.
    required: false
    default: https://cloud.langfuse.com
  langfuse-environment:
    description: Optional Langfuse environment of the traces, for example ci.
    required: false
outputs:
  outcome:
    description: published, skipped, errored, stale, or skipped-fork-without-auth-token.
  conclusion:
    description: GitHub Check conclusion when a report was produced.
runs:
  using: node24
  main: dist/action.js
