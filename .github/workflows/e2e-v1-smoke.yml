name: E2E published v1

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: audit
        uses: heyo-sh/heyo-code-audit@v1
        with:
          provider: openai
          model: gpt-5.6-terra
          auth-type: api-key
          auth-token: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ github.token }}
          fail-on: never
          comment-on-clean: "true"

      - name: Assert the published action reported the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.audit.outputs.outcome }}
          CONCLUSION: ${{ steps.audit.outputs.conclusion }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "published"
          test "$CONCLUSION" = "success"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
            --jq '.check_runs[] | select(.name == "Heyo Code Audit") | .conclusion' \
            | grep -qx "success"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "COMMENTED") | .id' \
            | grep -q .
